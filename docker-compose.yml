services:
  # ── Guardian API (Bun gateway) ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardian-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
