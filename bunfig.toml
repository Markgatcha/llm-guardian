[install]
peer = false
optional = true

[test]
# Preload types so every test file has the ChatMessage shape without
# per-file import boilerplate.
preload = ["./src/core/types.ts"]
# Bun 1.4: test files run in parallel via the --parallel CLI flag
# (see package.json "test" / "test:all" scripts).

[run]
# Equivalent to `bun --bun` for all `bun run` commands — aliases node
# to bun inside lifecycle scripts.
bun = true
