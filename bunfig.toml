[install]
peer = false
optional = true

[test]
# Preload types so every test file has the ChatMessage shape without
# per-file import boilerplate.
preload = ["./src/core/types.ts"]
# Bun 1.4: test files run in parallel via the --parallel CLI flag
# (see package.json "test" / "test:all" scripts).

# NOTE: `[run] bun = true` (alias node -> bun in lifecycle scripts) was
# removed: it forces node-based tooling onto Bun's runtime, which breaks
# vitest 5 + jsdom 30 (jsdom creates its window in a vm context when
# `runScripts` is set, and its private-field brand checks fail under Bun).
# Keep node shebangs resolving to real node.
